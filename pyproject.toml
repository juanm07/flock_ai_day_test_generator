[project]
name = "tbg"
version = "0.1.0"
description = "Test & Bug Generator: núcleo determinista (category-partition, BVA, pairwise, reglas) que cualquier agente LLM usa como tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "allpairspy>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
llm = ["anthropic>=1.0", "openai>=1.40"]
all = ["tbg[ui,llm]"]

[project.scripts]
tbg = "tbg.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tbg = ["templates/*.j2", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
